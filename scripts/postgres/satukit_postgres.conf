# ==============================================================================
# Satukit PostgreSQL Co-located Hardening & Tuning Configuration (DEC-021)
# Memory Target: VPS 2.2 GiB RAM budget (PostgreSQL RSS ceiling < 400 MB)
# ==============================================================================

# 1. Network & Connectivity Hardening (NFR-SEC-012)
# Loopback listen only. DILARANG membuka ke 0.0.0.0 atau IP publik VPS!
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 30
superuser_reserved_connections = 3

# 2. Authentication Security
password_encryption = 'scram-sha-256'

# 3. Memory & Resource Tuning (DEC-021: VPS 2.2 GiB Total RAM)
# shared_buffers: 128 MB (cukup untuk dataset relasional Satukit tanpa merebut RAM media worker)
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB
min_wal_size = 64MB
max_wal_size = 1GB

# 4. Storage & Query Planner (Optimized for VPS SSD)
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 100

# 5. Logging & Audit (NFR-SEC-006)
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 250
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
