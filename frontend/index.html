<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/satukit-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Satukit — Satu Tempat, Banyak Solusi Digital. Platform lengkap pembuatan CV profesional ATS, alat manipulasi PDF, penghapus latar belakang gambar AI, dan utilitas produktivitas." />
    <title>Satukit — Satu Tempat, Banyak Solusi Digital</title>
    <script>
      try {
        const t = localStorage.getItem('satukit_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
